<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            z-index: 10;
            background: rgba(30, 41, 59, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.5);
            border: 2px solid #f43f5e;
            max-width: 500px;
            width: 85%;
        }
        h1 {
            color: #f43f5e;
            font-size: 1.8rem;
            animation: pulse 1.5s infinite;
            margin-bottom: 20px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        p {
            color: #e2e8f0;
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: left;
        }
        /* Floating background elements */
        .floating-item {
            position: absolute;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 4s linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>❤️ SYSTEM_LOVE.exe ❤️</h1>
        <p id="typing-text"></p>
    </div>

    <script>
        // Moving typewriter text effect
        const text = "Initializing love protocol...\n\nEvery moment with you feels like executing the cleanest code of my life. You are my favorite notification, my best feature, and my entire world. I love you endlessly! 💖";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typing-text").innerHTML += text.charAt(i) === '\n' ? '<br><br>' : text.charAt(i);
                i++;
                setTimeout(typeWriter, 35);
            }
        }
        setTimeout(typeWriter, 500);

        // Generating floating moving icons in the background
        function createItem() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            const icons = ['❤️', '💻', '✨', '💖', '🚀', '⚡'];
            item.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(item);
            setTimeout(() => {
                item.remove();
            }, 4000);
        }
        setInterval(createItem, 250);
    </script>
</body>
</html>
